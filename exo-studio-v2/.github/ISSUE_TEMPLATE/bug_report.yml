name: Bug report
description: Report a reproducible EXO Sample 3D failure
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Garment/template, exact steps, backend and settings.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Diagnostics
      description: Seam gaps, strain, penetration, console errors, screenshots or test output when relevant.
  - type: input
    id: platform
    attributes:
      label: Platform / backend
      placeholder: macOS Apple Silicon, browser-pbd
