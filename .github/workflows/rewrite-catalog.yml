name: Rewrite catalog and coordinator checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# One validation per PR revision; main and manual runs keep independent groups.
# Do not apply this policy to the serialized coordination ledger writer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/rewrite-tasks.test.mjs
      - run: node --test scripts/ci-policy.test.mjs
      - run: node --test scripts/coordination/engine.test.mjs
      - run: node scripts/rewrite-tasks.mjs check
      - name: Check generated catalog
        shell: bash
        run: |
          node scripts/rewrite-tasks.mjs markdown > /tmp/clothcraft-tasks.md
          diff -u coordination/TASKS.md /tmp/clothcraft-tasks.md
