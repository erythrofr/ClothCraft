name: CPU reference
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# One validation per PR revision; main and manual runs keep independent groups.
# Do not apply this policy to the serialized coordination ledger writer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Cache dependencies only; every revision still compiles and runs its checks.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: clothcraft-deps-v1
          key: cpu-no-default-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          env-vars: ImageOS ImageVersion
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features -j 2 -- --test-threads=2
      - run: cargo clippy --locked --no-default-features --all-targets -j 2 -- -D warnings
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/two-panel.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/local-ease.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/tshirt.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/dress.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- validate examples/templates/curved-panels.json
      - run: cargo run --locked --no-default-features -j 2 --bin cloth-template -- simulate examples/templates/two-panel.json --steps 30 --threads 2 --output output/ci-template
  # Compile and test desktop code as well as the headless core.
  # GPU tests stay ignored; this job does not open a window or initialize a GPU.
  desktop:
    runs-on: ubuntu-latest
    env:
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Cache dependencies only; every revision still compiles and runs its checks.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: clothcraft-deps-v1
          key: desktop-dev-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          env-vars: ImageOS ImageVersion
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The desktop test target LINKS, so it needs X11/Wayland and an OpenGL
      # loader; `check` and `clippy` alone would not require them.
      - name: Install Linux desktop link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libssl-dev pkg-config
      - run: cargo check --locked --features desktop -j 2 --bin cloth-fit --bin marvelous-cloth
      - run: cargo clippy --locked --features desktop --all-targets -j 2 -- -D warnings
      - run: cargo test --locked --features desktop -j 2 -- --test-threads=2
